<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Definitions for arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
  </defs>

  <style>
    .title { font-family: sans-serif; font-weight: bold; font-size: 16px; fill: #333; }
    .node-text { font-family: monospace; font-size: 12px; fill: #000; }
    .label-text { font-family: sans-serif; font-size: 11px; fill: #555; }
    
    .bg-android { fill: #d1e7dd; stroke: #0f5132; stroke-width: 2; rx: 8; }
    .bg-native { fill: #cff4fc; stroke: #087990; stroke-width: 2; rx: 8; }
    .bg-unity { fill: #f8d7da; stroke: #842029; stroke-width: 2; rx: 8; }
    
    .node { fill: #ffffff; stroke: #333333; stroke-width: 1.5; rx: 4; }
    .edge { stroke: #333333; stroke-width: 2; fill: none; }
    .edge-dash { stroke: #666666; stroke-dasharray: 5,5; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Background Canvas Grid -->
  <rect width="800" height="600" fill="#fafafa" rx="10" stroke="#ddd" stroke-width="1" />

  <!-- Subgraph: Android OS -->
  <rect x="50" y="30" width="700" height="110" class="bg-android" />
  <text x="70" y="55" class="title">Android OS</text>
  
  <rect x="90" y="75" width="280" height="50" class="node" />
  <text x="230" y="104" text-anchor="middle" class="node-text">Device Resize/Fold Event</text>
  
  <rect x="430" y="75" width="280" height="50" class="node" />
  <text x="570" y="104" text-anchor="middle" class="node-text">Hinge Angle Sensor</text>

  <!-- Subgraph: Native Android Layer -->
  <rect x="50" y="180" width="700" height="110" class="bg-native" />
  <text x="70" y="205" class="title">Native Android Layer</text>
  
  <rect x="90" y="225" width="620" height="50" class="node" />
  <text x="400" y="254" text-anchor="middle" class="node-text">LargeScreenPlayableActivity.java</text>

  <!-- Subgraph: Unity C# Layer -->
  <rect x="50" y="330" width="700" height="240" class="bg-unity" />
  <text x="70" y="355" class="title">Unity C# Scripting Layer</text>
  
  <!-- ConfigurationManager -->
  <rect x="90" y="375" width="620" height="50" class="node" />
  <text x="400" y="404" text-anchor="middle" class="node-text">ConfigurationManager (GameObject)</text>

  <!-- SafeZoneUI -->
  <rect x="90" y="490" width="180" height="50" class="node" />
  <text x="180" y="519" text-anchor="middle" class="node-text">SafeZoneUI.cs</text>

  <!-- ConfigurationResponse -->
  <rect x="310" y="490" width="220" height="50" class="node" />
  <text x="420" y="519" text-anchor="middle" class="node-text">ConfigurationResponse.cs</text>

  <!-- DebuggingInfo -->
  <rect x="570" y="490" width="140" height="50" class="node" />
  <text x="640" y="519" text-anchor="middle" class="node-text">DebuggingInfo.cs</text>

  <!-- Connections / Arrows -->
  
  <!-- Activity monitors events (Dashed) -->
  <path d="M 230 225 L 230 135" class="edge-dash" marker-end="url(#arrow-dash)" />
  <path d="M 570 225 L 570 135" class="edge-dash" marker-end="url(#arrow-dash)" />
  <text x="240" y="165" class="label-text">Monitors WindowLayout</text>
  
  <!-- Activity to ConfigurationManager -->
  <path d="M 400 275 L 400 365" class="edge" marker-end="url(#arrow)" />
  <text x="410" y="325" class="label-text">UnitySendMessage (JSON payload)</text>

  <!-- ConfigurationManager to SafeZoneUI -->
  <path d="M 180 425 L 180 480" class="edge" marker-end="url(#arrow)" />
  <text x="190" y="455" class="label-text">OnConfigurationChanged</text>

  <!-- ConfigurationManager to ConfigurationResponse -->
  <path d="M 420 425 L 420 480" class="edge" marker-end="url(#arrow)" />
  <text x="430" y="455" class="label-text">OnFoldChanged / Config</text>

  <!-- SafeZoneUI to DebuggingInfo -->
  <path d="M 270 515 L 560 515" class="edge-dash" marker-end="url(#arrow-dash)" />
  <text x="375" y="505" text-anchor="middle" class="label-text">OnSafeZoneUpdated</text>

</svg>
